<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veiider: Ultra Parkour Legend</title>
    <style>
        :root {
            --bg-color: #050505;
            --accent: #ff0000;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Arial Black', Gadget, sans-serif;
            color: white;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        canvas {
            background: linear-gradient(to bottom, #1a1a2e 0%, #16213e 100%);
            box-shadow: 0 0 100px rgba(255,0,0,0.1);
            display: block;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 25px;
            border-radius: 4px;
            border-left: 6px solid var(--accent);
            margin-bottom: 12px;
            font-size: 1.4rem;
            letter-spacing: 2px;
            text-shadow: 2px 2px #000;
        }

        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            color: #fff;
            text-shadow: 0 0 30px var(--accent);
        }

        .btn-start {
            background: var(--accent);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 2rem;
            cursor: pointer;
            margin-top: 30px;
            font-weight: 900;
            clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
            transition: 0.3s;
        }

        .btn-start:hover {
            transform: scale(1.1) skew(-5deg);
            background: #fff;
            color: #ff0000;
        }

        #level-announcer {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 40%;
            font-size: 6rem;
            font-weight: 900;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s, transform 0.5s;
            z-index: 5;
            text-transform: uppercase;
            text-shadow: 0 0 50px rgba(255,0,0,0.5);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui">
        <div class="stat-box">LVL: <span id="level-num">1</span>/12</div>
        <div class="stat-box">DISTANCIA: <span id="progress-num">0%</span></div>
    </div>

    <div id="level-announcer">Nivel 1</div>

    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
        <h1>VEIIDER <span style="color:red">PARKOUR</span></h1>
        <p style="max-width: 600px; color: #ccc; font-size: 1.2rem;">
            Veiider con la del Millo está listo. 12 niveles de pura adrenalina. 
            ¡Nuevas cajas de madera añadidas para puzzles extremos! 📦🔥
        </p>
        <button class="btn-start" id="start-btn">JUGAR AHORA</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('start-btn');
    const overlay = document.getElementById('overlay');
    const levelNumDisplay = document.getElementById('level-num');
    const progressDisplay = document.getElementById('progress-num');
    const levelAnnouncer = document.getElementById('level-announcer');

    canvas.width = 1280;
    canvas.height = 720;

    const GRAVITY = 0.55;
    const FRICTION = 0.85;
    const JUMP_FORCE = -13;
    const MOVE_SPEED = 6;

    let currentLevel = 1;
    let isGameRunning = false;
    let cameraX = 0;
    const keys = {};

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    class Player {
        constructor() {
            this.w = 42;
            this.h = 66;
            this.resetPosition();
            this.velX = 0;
            this.velY = 0;
            this.isJumping = false;
            this.dir = 1;
            this.walkFrame = 0;
            this.walkCounter = 0;
        }

        resetPosition() {
            this.x = 100; 
            this.y = 450; 
            this.velX = 0;
            this.velY = 0;
        }

        update() {
            if (keys['ArrowRight'] || keys['KeyD']) {
                this.velX = MOVE_SPEED;
                this.dir = 1;
            } else if (keys['ArrowLeft'] || keys['KeyA']) {
                this.velX = -MOVE_SPEED;
                this.dir = -1;
            } else {
                this.velX *= FRICTION;
            }

            if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && !this.isJumping) {
                this.velY = JUMP_FORCE;
                this.isJumping = true;
            }

            this.velY += GRAVITY;
            this.x += this.velX;
            this.y += this.velY;

            if (this.y > canvas.height + 100) this.die();

            if (Math.abs(this.velX) > 0.5) {
                this.walkCounter++;
                if (this.walkCounter > 8) {
                    this.walkFrame = this.walkFrame === 0 ? 1 : 0;
                    this.walkCounter = 0;
                }
            }
        }

        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            if (this.dir === -1) {
                ctx.scale(-1, 1);
                ctx.translate(-this.w, 0);
            }

            ctx.fillStyle = "#000"; 
            ctx.fillRect(4, 24, 34, this.h - 24);
            
            ctx.strokeStyle = "#ff0000";
            ctx.lineWidth = 7;
            ctx.beginPath(); ctx.moveTo(6, 30); ctx.lineTo(36, 55); ctx.stroke();

            ctx.fillStyle = "white";
            ctx.font = "bold 6px Arial";
            ctx.fillText("QUILMES", 10, 50);

            ctx.fillStyle = "#f5d0a9"; 
            ctx.fillRect(8, 0, 26, 24);
            
            ctx.fillStyle = "#4b2c11";
            ctx.fillRect(8, 0, 26, 8); 
            ctx.fillRect(8, 16, 26, 8); 
            
            ctx.fillStyle = "#000";
            ctx.fillRect(4, 4, 6, 14); 
            ctx.fillRect(32, 4, 6, 14); 
            ctx.fillRect(8, 2, 26, 4); 

            ctx.fillStyle = "black";
            ctx.fillRect(15, 12, 3, 3);
            ctx.fillRect(25, 12, 3, 3);

            ctx.fillStyle = "#000";
            ctx.fillRect(10, this.h - 10, 10, 10 + (this.isJumping ? -5 : 0));
            ctx.fillRect(22, this.h - 10, 10, 10 + (this.isJumping ? 5 : 0));

            ctx.restore();
        }

        die() {
            this.resetPosition();
            cameraX = 0;
        }
    }

    class Entity {
        constructor(x, y, w, h, type, color = "#444") {
            this.x = x; this.y = y; this.w = w; this.h = h;
            this.type = type; this.color = color;
            this.initX = x;
            this.time = Math.random() * 10;
        }

        update() {
            if (this.type === 'ball') {
                this.time += 0.04;
                this.x = this.initX + Math.sin(this.time) * 250;
            }
        }

        draw() {
            ctx.save();
            if (this.type === 'platform') {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.strokeStyle = "rgba(255,255,255,0.1)";
                ctx.strokeRect(this.x, this.y, this.w, this.h);
            } else if (this.type === 'box') {
                ctx.fillStyle = "#8b4513";
                ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.strokeStyle = "#3e1d05";
                ctx.lineWidth = 3;
                ctx.strokeRect(this.x+4, this.y+4, this.w-8, this.h-8);
                ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x+this.w, this.y+this.h); ctx.stroke();
            } else if (this.type === 'lava') {
                ctx.fillStyle = "#ff2200";
                ctx.shadowBlur = 20; ctx.shadowColor = "red";
                ctx.fillRect(this.x, this.y, this.w, this.h);
            } else if (this.type === 'ball') {
                ctx.fillStyle = "#222";
                ctx.beginPath();
                ctx.arc(this.x + this.w/2, this.y + this.h/2, this.w/2, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "#666";
                ctx.beginPath(); ctx.arc(this.x + this.w/2, this.y + this.h/2, 10, 0, Math.PI*2); ctx.fill();
            } else if (this.type === 'goal') {
                ctx.fillStyle = "rgba(0, 255, 0, 0.5)";
                ctx.fillRect(this.x, this.y, this.w, this.h);
                ctx.shadowBlur = 30; ctx.shadowColor = "lime";
                ctx.fillStyle = "#0f0";
                ctx.fillRect(this.x + 20, this.y, 10, this.h);
            }
            ctx.restore();
        }
    }

    const player = new Player();
    let levelElements = [];
    let worldWidth = 8000;

    function buildLevel(lvl) {
        currentLevel = lvl;
        levelNumDisplay.innerText = lvl;
        
        // Nombres de niveles basados en la historia de Veiider
        const levelNames = [
            "CIUDAD", "CYBERPUNK NIGHT", "EDIFICIOS LADRILLO", "NATURALEZA FLOTANTE",
            "CONSTRUCCIÓN NOCTURNA", "BOSQUE OSCURO", "SPEED VAULT", "VOLCÁN ACTIVO",
            "ESPACIO EXTERIOR", "INFRAMUNDO", "RUINAS ANTIGUAS", "FINAL LEGENDARIO"
        ];
        
        levelAnnouncer.innerText = levelNames[lvl-1] || `Nivel ${lvl}`;
        levelAnnouncer.style.opacity = 1;
        levelAnnouncer.style.transform = "scale(1.2)";
        setTimeout(() => { levelAnnouncer.style.opacity = 0; levelAnnouncer.style.transform = "scale(1)"; }, 1500);

        player.resetPosition();
        cameraX = 0;
        levelElements = [];
        worldWidth = 5000 + (lvl * 1500);

        // CONFIGURACIÓN NIVEL 1
        if (lvl === 1) {
            levelElements.push(new Entity(0, 520, 600, 300, 'platform', '#222'));
            levelElements.push(new Entity(550, 470, 50, 50, 'box'));

            let lastX = 600;
            for (let i = 0; i < 15; i++) {
                let gap = 180 + Math.random() * 100; 
                let platW = 250 + Math.random() * 150;
                let platY = 400 + Math.random() * 100;
                levelElements.push(new Entity(lastX + gap, platY, platW, 40, 'platform', '#333'));
                levelElements.push(new Entity(lastX + gap - 50, 680, gap + 100, 40, 'lava'));
                if (Math.random() > 0.8) levelElements.push(new Entity(lastX + gap + 50, platY - 50, 50, 50, 'box'));
                lastX += gap + platW;
            }
            worldWidth = lastX + 500;
        } else {
            // NIVELES 2 AL 12: MÁS CAJAS
            levelElements.push(new Entity(0, 520, 600, 300, 'platform', '#222'));
            levelElements.push(new Entity(450, 470, 50, 50, 'box'));
            levelElements.push(new Entity(520, 470, 50, 50, 'box')); // Segunda caja al inicio

            for (let x = 850; x < worldWidth; x += 350) {
                let platW = 200 + Math.random() * 200;
                let platY = 250 + Math.random() * 300;
                let color = (lvl === 7 ? '#eee' : '#333');
                
                levelElements.push(new Entity(x - 100, 680, 500, 40, 'lava'));
                levelElements.push(new Entity(x, platY, platW, 40, 'platform', color));
                
                if (lvl > 1 && Math.random() > 0.5) levelElements.push(new Entity(x + 50, platY - 180, 60, 60, 'ball'));
                
                // MÁS CAJAS: Alta probabilidad a partir del nivel 2
                if (Math.random() > 0.4) {
                    levelElements.push(new Entity(x + 20, platY - 50, 50, 50, 'box'));
                    // Posibilidad de torres de cajas
                    if (Math.random() > 0.7) {
                        levelElements.push(new Entity(x + 20, platY - 100, 50, 50, 'box'));
                    }
                    if (Math.random() > 0.8) {
                        levelElements.push(new Entity(x + 80, platY - 50, 50, 50, 'box'));
                    }
                }
            }
        }

        levelElements.push(new Entity(worldWidth - 300, 200, 100, 520, 'goal'));
    }

    function update() {
        if (!isGameRunning) return;
        player.update();

        levelElements.forEach(el => {
            el.update();

            if (player.x < el.x + el.w && player.x + player.w > el.x &&
                player.y < el.y + el.h && player.y + player.h > el.y) {
                
                if (el.type === 'lava' || el.type === 'ball') player.die();
                
                if (el.type === 'platform' || el.type === 'box') {
                    if (player.velY > 0 && player.y + player.h - player.velY <= el.y) {
                        player.y = el.y - player.h;
                        player.velY = 0;
                        player.isJumping = false;
                    } 
                    if (el.type === 'box') {
                        if (player.x + player.w > el.x && player.x < el.x) el.x += 2.5;
                        if (player.x < el.x + el.w && player.x > el.x) el.x -= 2.5;
                    }
                }

                if (el.type === 'goal') {
                    if (currentLevel < 12) buildLevel(currentLevel + 1);
                    else { alert("¡MAESTRO DEL PARKOUR! VEIIDER GANÓ."); location.reload(); }
                }
            }
        });

        cameraX += (player.x - cameraX - 400) * 0.1;
        if (cameraX < 0) cameraX = 0;

        progressDisplay.innerText = Math.floor((player.x / worldWidth) * 100) + "%";
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(-cameraX, 0);
        
        levelElements.forEach(el => el.draw());
        player.draw();
        
        ctx.restore();
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    startBtn.addEventListener('click', () => {
        overlay.style.display = 'none';
        isGameRunning = true;
        buildLevel(1);
        loop();
    });

</script>
</body>
</html>
